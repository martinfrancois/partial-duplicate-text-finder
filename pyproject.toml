[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "partial-duplicate-text-finder"
version = "0.1.0"
description = "Find text files in a folder that are partial duplicates of each other."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
partial-duplicate-text-finder = "finder:main"

[tool.setuptools]
py-modules = ["finder"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
